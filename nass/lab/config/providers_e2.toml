usd_per_million_output_tokens = 0.8
price_verified = true
source = "Featherless model page lists Input $0.4 / Output $0.8; official Developer pricing docs state all model-page prices are USD per 1M tokens (verified 2026-11-17)"
[providers.limits]
max_pages_per_request = 1
max_requests_per_run = 1
request_timeout_s = 180
poll_timeout_s = 0
poll_initial_interval_s = 0.0
poll_max_interval_s = 0.0
max_response_bytes = 5000000
max_cost_usd_per_run = 0.02
# Internal limits of this project (not provider quotas).
max_pages_per_enablement = 100
max_pages_per_day_ceiling = 100
max_pages_cumulative = 500
default_enablement_days = 7

[[providers]]
id = "oxen-qwen3-vl-4b-instruct"
label = "Oxen.ai - Qwen3-VL-4B-Instruct (compute-time billing)"
provider = "Oxen.ai"
status = "implemented"
protocol = "openai_chat_completions_v1"
api_base_url = "https://hub.oxen.ai"
api_path = "/api/ai/chat/completions"
api_model_id = "qwen3-vl-4b-instruct"
requested_model = "qwen3-vl-4b-instruct (Oxen model page: source model Qwen/Qwen3-VL-4B-Instruct; quantization 'specific to the inference provider', listed as not quantized; no revision stated)"
local_counterpart = "qwen3-vl-4b"
reported_revision = "not reported by the API"
exact_revision_verified = false
classification = "SAME MODEL FAMILY, REVISION UNVERIFIED"
credential_env = "OXEN_API_KEY"
credential_label = "Oxen API key"
result_hosts = []
optional_payload = {}
# Same static prompt and generation options as the local qwen3-vl-4b entry and
# Featherless, so the hosted runs are comparable.
prompt_id = "vlm_transcribe_v1"
# Server-sent events ("stream": true, documented in the Oxen chat completions
# reference). Two live non-streaming requests got no response headers within 120 s
# after a complete upload; streaming shows whether the model starts producing
# tokens. The budget bounds headers plus body together; raised from 120 s to 300 s
# on 2026-11-18 (repeated timeouts), with the billing bound kept at timeout + 60 s.
stream = true
data_residency = "Oxen.ai (hub.oxen.ai); underlying inference provider, region and retention policy not documented or reviewed"
protocol_source = "docs.oxen.ai inference-api reference (chat_completions, overview, vision_language_models, models/qwen3-vl-4b-instruct), read 2026-11-17"
[providers.generation]
temperature = 0.0
max_tokens = 4096
[providers.pricing]
basis = "per_compute_second"
usd_per_compute_second = 0.0014
# Conservative preflight bound: billing may continue on the provider after a local
# timeout (not documented), so the bound allows 60 s beyond request_timeout_s.
max_billable_seconds_per_request = 360
estimated_usd_per_page = 0.504
price_verified = false
source = "Rate USD 0.0014 per compute second supplied by the user; Oxen docs confirm per-second compute-time billing for Qwen models but the figure was not found in public docs. Each response's usage.cost (decimal string, usage.currency) is the reconciled actual charge."
[providers.limits]
max_pages_per_request = 1
max_requests_per_run = 1
request_timeout_s = 300
poll_timeout_s = 0
poll_initial_interval_s = 0.0
poll_max_interval_s = 0.0
max_response_bytes = 5000000
max_cost_usd_per_run = 0.504
# Internal limits of this project (not provider quotas).
max_pages_per_enablement = 100
max_pages_per_day_ceiling = 100
max_pages_cumulative = 500
default_enablement_days = 7

