# E2-C hosted API providers: EXPERIMENTAL EVALUATION ONLY.
#
# The production system is self-hosted and air-gapped; nothing here is part of it.
# This registry is separate from models_e2.toml and never changes local inference.
#
# A provider can send a request only when ALL of these hold:
#   1. status = "implemented" (planned providers are listed but cannot run);
#   2. the user created a local, unexpired enablement record for it (UI);
#   3. a credential is supplied for this session (never stored);
#   4. the user confirmed the exact bytes to be sent, for that one request.
# Outbound traffic is restricted to `api_base_url`'s host and `result_hosts`.

[[providers]]
id = "baidu-aistudio-paddleocr-vl-1.6"
label = "Baidu AI Studio - PaddleOCR-VL 1.6 (official hosted document parsing)"
provider = "Baidu AI Studio"
status = "implemented"
protocol = "baidu_paddleocr_jobs_v2"
api_base_url = "https://paddleocr.aistudio-app.com"
api_path = "/api/v2/ocr/jobs"
api_model_id = "PaddleOCR-VL-1.6"
requested_model = "PaddleOCR-VL 1.6 official full-page document parsing (layout + VL)"
local_counterpart = "paddleocr-vl-1.6-full-page"
reported_revision = "not reported by the API"
exact_revision_verified = false
classification = "SAME MODEL FAMILY, REVISION UNVERIFIED"
credential_env = "PADDLEOCR_ACCESS_TOKEN"
credential_label = "AI Studio access token"
# Hosts the job's pre-signed result URL may use. Unknown until the first real job:
# empty means a result on any other host is refused (the run stops and reports it).
result_hosts = []
# Exact Baidu Object Storage (bcebos.com, Beijing region) hosts that the official
# job-status API returned for real jobs of this endpoint on 2026-11-17 (Stage 1
# batch stage1_20261117T223256294314Z_63be82). No wildcard: any other host is never
# approved automatically and still needs a manual per-job approval. Used ONLY when
# the user enables the automatic result-host policy (page 8); empty = manual only.
auto_result_hosts = [
  "paddleocr-store-1.bj.bcebos.com",
  "paddleocr-store-2.bj.bcebos.com",
  "paddleocr-store-4.bj.bcebos.com",
  "paddleocr-store-6.bj.bcebos.com",
  "paddleocr-store-7.bj.bcebos.com",
  "paddleocr-store-8.bj.bcebos.com",
  # Reported by a real full-PDF job (English Paddle run, page 4), added 2026-11-18.
  "paddleocr-store.bj.bcebos.com",
]
# Vendor defaults: no option is overridden (empty optionalPayload).
optional_payload = {}
data_residency = "Baidu AI Studio (operated by Baidu, China); retention policy not reviewed"
protocol_source = "paddleocr==3.7.0 paddleocr/_api_client (_http.py, _core.py, _poller.py), read statically"
[providers.pricing]
basis = "per_page"
estimated_usd_per_page = 0.0
source = "published free daily quota; paid tier price not published (cost reported by provider: none)"
[providers.limits]
max_pages_per_request = 1
max_requests_per_run = 1
request_timeout_s = 60
poll_timeout_s = 600
poll_initial_interval_s = 3.0
poll_max_interval_s = 15.0
max_response_bytes = 20000000
max_cost_usd_per_run = 0.0
# Internal limits of this project (NOT Baidu quotas; the free daily quota is not published as a number,
# so provider_documented_daily_pages is not set). Budget per enablement period, per UTC day, and a
# cumulative cap over the whole history so re-enabling cannot raise the budget without limit.
max_pages_per_enablement = 500
max_pages_per_day_ceiling = 100
max_pages_cumulative = 2000
default_enablement_days = 7

[[providers]]
